# Controller manager configuration of the single lwr example (ROS 2).
# The controller manager runs in the /lwr namespace (gazebo_ros2_control plugin or ros2_control_node).
/**/controller_manager:
  ros__parameters:
    # For the real robot, match the FRI sample time set in the KRL script (e.g. 500 for 2 ms)
    update_rate: 1000

    # CONTROLLERS USED IN THE EXAMPLE
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # replaces the ROS 1 stiffness_trajectory_controller (a trajectory controller can't command the stiffness interfaces)
    joint_stiffness_controller:
      type: forward_command_controller/ForwardCommandController

    joint_position_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_effort_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ## OTHER CUSTOM CONTROLLERS LEFT HERE AS EXAMPLES
    arm_state_controller:
      type: arm_state_controller/ArmStateController
    gravity_compensation_controller:
      type: lwr_controllers/GravityCompensation
    joint_impedance_controller:
      type: lwr_controllers/JointImpedanceController
    inverse_dynamics_controller:
      type: lwr_controllers/InverseDynamicsController
    computed_torque_controller:
      type: lwr_controllers/ComputedTorqueController
    one_task_inverse_kinematics:
      type: lwr_controllers/OneTaskInverseKinematics
    cartesian_impedance_controller:
      type: lwr_controllers/CartesianImpedanceController
    multi_task_priority_inverse_kinematics:
      type: lwr_controllers/MultiTaskPriorityInverseKinematics
    one_task_inverse_dynamics_JL:
      type: lwr_controllers/OneTaskInverseDynamicsJL
    multi_task_priority_inverse_dynamics:
      type: lwr_controllers/MultiTaskPriorityInverseDynamics
    minimum_effort_inverse_dynamics:
      type: lwr_controllers/MinimumEffortInverseDynamics
    back_stepping_controller:
      type: lwr_controllers/BacksteppingController
    dynamics_sliding_mode_controller:
      type: lwr_controllers/DynamicSlidingModeController
    dynamics_sliding_mode_controller_task_space_controller:
      type: lwr_controllers/DynamicSlidingModeControllerTaskSpace

/**/joint_state_broadcaster:
  ros__parameters:
    # publish the joint states at 100 Hz (as the ROS 1 joint_state_controller), not at the controller manager rate
    update_rate: 100

# THIS CONFIGURATION IS ACTUALLY SENDING TAU = K*Q
/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - lwr_a1_joint
      - lwr_a2_joint
      - lwr_e1_joint
      - lwr_a3_joint
      - lwr_a4_joint
      - lwr_a5_joint
      - lwr_a6_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]

/**/joint_stiffness_controller:
  ros__parameters:
    joints:
      - lwr_a1_joint
      - lwr_a2_joint
      - lwr_e1_joint
      - lwr_a3_joint
      - lwr_a4_joint
      - lwr_a5_joint
      - lwr_a6_joint
    interface_name: stiffness

/**/joint_position_position_controller:
  ros__parameters:
    joints:
      - lwr_a1_joint
      - lwr_a2_joint
      - lwr_e1_joint
      - lwr_a3_joint
      - lwr_a4_joint
      - lwr_a5_joint
      - lwr_a6_joint

/**/joint_effort_trajectory_controller:
  ros__parameters:
    joints:
      - lwr_a1_joint
      - lwr_a2_joint
      - lwr_e1_joint
      - lwr_a3_joint
      - lwr_a4_joint
      - lwr_a5_joint
      - lwr_a6_joint
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    gains:
      lwr_a1_joint: {p: 250.0, i: 10.0, d: 30.0, i_clamp: 0.3}
      lwr_a2_joint: {p: 220.0, i: 10.0, d: 30.0, i_clamp: 0.3}
      lwr_e1_joint: {p: 150.0, i: 6.0, d: 20.0, i_clamp: 0.3}
      lwr_a3_joint: {p: 150.0, i: 5.0, d: 12.0, i_clamp: 0.3}
      lwr_a4_joint: {p: 90.0, i: 5.0, d: 10.0, i_clamp: 0.3}
      lwr_a5_joint: {p: 40.0, i: 5.0, d: 7.0, i_clamp: 0.3}
      lwr_a6_joint: {p: 15.0, i: 2.0, d: 5.0, i_clamp: 0.3}

/**/arm_state_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
    publish_rate: 30.0

/**/gravity_compensation_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link

# Joint Impedance Controllers
/**/joint_impedance_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
    stiffness_gains: 300.0
    damping_gains: 0.7

# Inverse Dynamics Controllers
/**/inverse_dynamics_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link

# Computed Torque Controllers
/**/computed_torque_controller:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link

# One Task Inverse Kinematics
/**/one_task_inverse_kinematics:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link

# Cartesian Impedance
/**/cartesian_impedance_controller:
  ros__parameters:
    robot_name: lwr
    root_name: lwr_base_link
    tip_name: lwr_7_link
    publish_cartesian_pose: false

# PID gains of the controllers based on PIDKinematicChainControllerBase
/**/multi_task_priority_inverse_kinematics:
  ros__parameters:
    root_name: lwr_base_link
    tip_name: lwr_7_link
    pid_lwr_a1_joint: {p: 250.0, i: 10.0, d: 30.0, i_clamp_min: -0.3, i_clamp_max: 0.3}
    pid_lwr_a2_joint: {p: 220.0, i: 10.0, d: 30.0, i_clamp_min: -0.3, i_clamp_max: 0.3}
    pid_lwr_e1_joint: {p: 150.0, i: 6.0, d: 20.0, i_clamp_min: -0.3, i_clamp_max: 0.3}
    pid_lwr_a3_joint: {p: 150.0, i: 5.0, d: 12.0, i_clamp_min: -0.3, i_clamp_max: 0.3}
    pid_lwr_a4_joint: {p: 90.0, i: 5.0, d: 10.0, i_clamp_min: -0.3, i_clamp_max: 0.3}
    pid_lwr_a5_joint: {p: 40.0, i: 5.0, d: 7.0, i_clamp_min: -0.3, i_clamp_max: 0.3}
    pid_lwr_a6_joint: {p: 15.0, i: 2.0, d: 5.0, i_clamp_min: -0.3, i_clamp_max: 0.3}

